<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#4E7D5E"/>
      <stop offset="60%" stop-color="#3F6B4F"/>
      <stop offset="100%" stop-color="#2F5440"/>
    </radialGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF4E4"/>
      <stop offset="100%" stop-color="#EFE3C8"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B8175"/>
      <stop offset="100%" stop-color="#5E574C"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9BC92"/>
      <stop offset="100%" stop-color="#B2946C"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C98A5E"/>
      <stop offset="100%" stop-color="#A2643C"/>
    </linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EAD5"/>
      <stop offset="100%" stop-color="#D6C6A6"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D8A0"/>
      <stop offset="100%" stop-color="#6FAE68"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="250" r="192" fill="url(#halo)"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="420" rx="150" ry="26" fill="#1E3A2B" opacity="0.45"/>

  <!-- cairn: four balanced stones -->
  <g>
    <ellipse cx="256" cy="380" rx="140" ry="52" fill="url(#s1)" transform="rotate(-2 256 380)"/>
    <ellipse cx="222" cy="352" rx="66" ry="14" fill="#FFFFFF" opacity="0.16"/>

    <ellipse cx="252" cy="300" rx="108" ry="44" fill="url(#s2)" transform="rotate(2 252 300)"/>
    <ellipse cx="226" cy="278" rx="52" ry="12" fill="#FFFFFF" opacity="0.28"/>

    <ellipse cx="258" cy="230" rx="80" ry="36" fill="url(#s3)" transform="rotate(-3 258 230)"/>
    <ellipse cx="238" cy="212" rx="38" ry="10" fill="#FFFFFF" opacity="0.26"/>

    <ellipse cx="254" cy="172" rx="50" ry="26" fill="url(#s4)" transform="rotate(2 254 172)"/>
    <ellipse cx="240" cy="160" rx="24" ry="7" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- sprout of new growth -->
  <g>
    <path d="M256 148 C 254 122, 258 108, 262 96" stroke="#6FAE68" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M262 96 C 240 92, 228 74, 230 58 C 252 60, 266 74, 264 96 Z" fill="url(#leaf)"/>
    <path d="M263 100 C 284 98, 298 84, 299 66 C 277 66, 262 80, 262 100 Z" fill="url(#leaf)" opacity="0.9"/>
  </g>
</svg>
